services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
      # empty key = mock KSP generator; put a real key in .env to use OpenRouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "uv run --no-sync python -m app.seed &&
      uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
