[project]
name = "sci-stats-api"
version = "0.1.0"
description = "Tiny FastAPI service for descriptive statistics of experimental data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
